[package]
name = "hue-mcp"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
dotenvy = "0.15.7"
mdns-sd = { version = "0.21.7", features = ["async"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
rmcp = { version = "3.9.0", features = ["transport-streamable-http-server"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
x509-parser = "0.18.1"

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["time"] }
wiremock = "0.6.5"
